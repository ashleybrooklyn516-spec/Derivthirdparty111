kind = "web"
previewPath = "/"
title = "Nimaya Trader"
version = "1.0.0"
id = "artifacts/nimaya-trader"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20019

[services.development]
run = "pnpm --filter @workspace/nimaya-trader run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/nimaya-trader", "run", "build" ]
publicDir = "artifacts/nimaya-trader/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20019"
BASE_PATH = "/"
